      { id: "41", title: "ホース内の閉塞", category: "設備異常", description: "塗料ホース内で粉が詰まる", cause: "ホースのたるみ、搬送エアー不足", countermeasure: "ホースを最短距離で張る、内径の適正化", consideration: "床に這わせた長いホースは閉塞の温床。", icon: "fa-hose", color: "blue" },
      { id: "42", title: "エアのオイルミスト混入", category: "設備異常", description: "吐出エアに油分が混ざりハジキを誘発", cause: "コンプレッサーのオイルフィルター寿命", countermeasure: "オイルフリーコンプへの変更、ラインフィルター交換", consideration: "末端でのエアチェック（白い紙に吹いてシミを見ること）を習慣化。", icon: "fa-oil-can", color: "amber" },
      { id: "43", title: "オーブン内のヤニ落下", category: "設備異常", description: "炉内の天井から茶色い塊が落ちてくる", cause: "昇華した樹脂成分が冷えて固まり落下", countermeasure: "定期的なオーブン内部の空焼き・清掃", consideration: "製品の真上にレールがある構造だと致命的。", icon: "fa-fire-burner", color: "red" },
      { id: "44", title: "コンベアからのゴミ落下", category: "設備異常", description: "チェーンの鉄粉や油が落ちてくる", cause: "コンベアの摩耗、過剰な注油", countermeasure: "耐熱グリスの適量塗布、ゴミ受けパンの設置", consideration: "C型レール内部の清掃は怠りがちだが重要。", icon: "fa-industry", color: "slate" },
      { id: "15", title: "パウダーのダマ（凝集）", category: "材料不良", description: "粉体が固まってダマになる", cause: "高温・多湿保管、古い塗料", countermeasure: "恒温恒湿（25℃以下）保管、シフター通し", consideration: "在庫管理（先入れ先出し）の徹底。", icon: "fa-cubes", color: "amber" },
      { id: "45", title: "ブロッキング（箱内固着）", category: "材料不良", description: "未開封の箱の中で粉がブロック状に固まる", cause: "輸送時の高温曝露（夏場のトラック等）、荷重", countermeasure: "クール便指定、積み上げ段数の制限", consideration: "手で崩れないレベルのブロッキングは廃棄対象。", icon: "fa-box", color: "orange" },
      { id: "46", title: "回収粉の劣化", category: "材料不良", description: "回収粉ばかり使うと塗着効率が落ちる", cause: "粉の帯電剤の枯渇、粒子形状の丸まり", countermeasure: "新粉と回収粉を自動混合するシステムの導入", consideration: "古い回収粉は潔く廃棄することもコスト削減に繋がる。", icon: "fa-trash-can", color: "gray" },
      { id: "47", title: "ロット間色ブレ", category: "材料不良", description: "塗料のロットが変わると色が合わない", cause: "メーカーの製造ブレ", countermeasure: "同一現場には同一ロットを割り当てる", consideration: "特にパステルカラーやグレー系で目立ちやすい。", icon: "fa-swatchbook", color: "pink" },
      { id: "14", title: "チョーキング（白亜化）", category: "経年劣化", description: "屋外暴露で表面が粉状に劣化", cause: "紫外線による樹脂分解", countermeasure: "高耐候性樹脂への変更", consideration: "屋外製品にエポキシ混合を使用するとすぐ発生。", icon: "fa-cloud", color: "slate" },
      { id: "48", title: "梱包材の跡", category: "その他", description: "製品にプチプチや段ボールの跡がつく", cause: "塗膜が完全に冷め切る前（約40℃以上）での梱包", countermeasure: "強制冷却ファン設置、手で触って完全に冷たいことの確認", consideration: "夏場は特に冷めにくい。焦って出荷するとクレーム直結。", icon: "fa-box-open", color: "orange" },
      { id: "49", title: "水切り乾燥不良によるシミ", category: "その他", description: "化成処理後の水滴跡がそのまま残る", cause: "水切りエアブロー不足、乾燥炉の温度不足", countermeasure: "エアブロー工程の人員増、純水リンス", consideration: "水滴跡の上は塗着が悪く、防錆力も落ちる。", icon: "fa-droplet", color: "cyan" },
      { id: "50", title: "シルク印刷の密着不良", category: "その他", description: "後工程で印刷した文字が剥がれる", cause: "塗料に含まれるレベリング剤（シリコンやワックス）の影響", countermeasure: "印刷対応（ワックスフリー）粉体の指定", consideration: "通常の粉体塗装は表面がツルツル弾くよう設計されているため注意。", icon: "fa-print", color: "indigo" }
  ].map(item => ({ ...item, author: "システム", date: new Date().toISOString() }));

  const icons = ["fa-droplet","fa-droplet-slash","fa-bug","fa-lemon","fa-magnet","fa-bolt","fa-bolt-lightning","fa-circle-dot","fa-palette","fa-layer-group","fa-sun","fa-triangle-exclamation","fa-square","fa-wind","fa-cloud","fa-cubes","fa-eye-slash","fa-spider","fa-water","fa-bubbles","fa-recycle","fa-hammer","fa-lines-leaning","fa-fire-flame-simple","fa-chess-board","fa-gem","fa-paintbrush","fa-smog","fa-temperature-arrow-down","fa-plug-circle-xmark","fa-disease","fa-scissors","fa-shield-virus","fa-gun","fa-hose","fa-oil-can","fa-fire-burner","fa-industry","fa-box","fa-trash-can","fa-swatchbook","fa-box-open","fa-print","fa-hand","fa-bomb","fa-truck-ramp-box"];
  const colors = ["blue", "red", "yellow", "orange", "purple", "indigo", "pink", "slate", "teal", "emerald", "cyan", "amber", "rose", "stone", "gray"];
  const categories = ["すべて", "表面異常", "外観異常", "膜厚異常", "塗着不良", "性能不良", "作業性不良", "設備異常", "材料不良", "経年劣化", "その他"];

  const TroubleDbApp = () => {
      const [reports, setReports] = useState([]);
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedCategory, setSelectedCategory] = useState("すべて");
      const [selectedReport, setSelectedReport] = useState(null);
      const [isFormOpen, setIsFormOpen] = useState(false);
      const [editingReport, setEditingReport] = useState(null);

      useEffect(() => {
          if (!db) { setReports(initialData); return; }
          const unsubscribe = db.collection('trouble_reports').onSnapshot(snapshot => {
              if (!snapshot.empty) {
                  setReports(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
              } else {
                  setReports(initialData);
                  initialData.forEach(item => db.collection('trouble_reports').doc(item.id).set(item));
              }
          }, () => setReports(initialData));
          return () => unsubscribe();
      }, []);

      const filteredReports = useMemo(() => {
          return reports.filter(r => {
              const matchQuery = (r.title||'').includes(searchQuery) || (r.cause||'').includes(searchQuery) || (r.category||'').includes(searchQuery);
              const matchCategory = selectedCategory === "すべて" || r.category === selectedCategory;
              return matchQuery && matchCategory;
          });
      }, [reports, searchQuery, selectedCategory]);

      const handleSaveReport = (data) => {
          localStorage.setItem('powderCoatingUser', data.author);
          const docId = editingReport ? editingReport.id : (data.id || Date.now().toString());
          const payload = { ...data, id: docId, date: new Date().toISOString() };
          
          if (db) {
              db.collection('trouble_reports').doc(docId).set(payload, { merge: true })
                  .then(() => { setIsFormOpen(false); setEditingReport(null); })
                  .catch(err => alert("保存エラー: " + err.message));
          } else {
              setReports(editingReport ? reports.map(r => r.id === docId ? payload : r) : [...reports, payload]);
              setIsFormOpen(false); setEditingReport(null);
          }
      };

      const handleDelete = (id) => {
          if (!verifyAdminPassword()) return;
          if (confirm("このレポートを削除しますか？")) {
              if (db) {
                  db.collection('trouble_reports').doc(id).delete()
                      .then(() => setSelectedReport(null))
                      .catch(err => alert("削除エラー: " + err.message));
              } else {
                  setReports(reports.filter(r => r.id !== id));
                  setSelectedReport(null);
              }
          }
      };

      return (
          <div className="min-h-full bg-slate-50 pb-24 text-slate-800" style={{ padding: '16px' }}>
              <header className="bg-slate-900 text-white shadow-md rounded-xl p-4 mb-4">
                  <div className="flex flex-col sm:flex-row justify-between items-center gap-3">
                      <div className="flex items-center gap-2">
                          <i className="fa-solid fa-spray-can-sparkles text-xl text-blue-400"></i>
                          <h1 className="text-lg font-bold">粉体塗装 不具合DB</h1>
                      </div>
                      <div className="relative w-full sm:w-72">
                          <i className="fa-solid fa-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                          <input type="text" placeholder="不具合・原因を検索..." style={{ color: '#ffffff', backgroundColor: '#1e293b' }}
                              className="w-full pl-9 pr-3 py-1.5 rounded-full text-sm focus:outline-none focus:ring-1 focus:ring-blue-400 placeholder-slate-400"
                              value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} />
                      </div>
                  </div>
                  <div className="mt-3">
                      <div className="flex gap-2 overflow-x-auto hide-scrollbar py-1">
                          {categories.map(cat => (
                              <button key={cat} onClick={() => setSelectedCategory(cat)}
                                  className={`shrink-0 px-3 py-1 text-xs font-semibold rounded-full transition-colors ${selectedCategory === cat ? 'bg-blue-500 text-white shadow' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}>
                                  {cat}
                              </button>
                          ))}
                      </div>
                  </div>
              </header>

              <main>
                  <div className="flex flex-col gap-2">
                      {filteredReports.map(report => (
                          <div key={report.id} onClick={() => setSelectedReport(report)}
                              className={`bg-white rounded-lg shadow-sm border-l-4 border-${report.color||'blue'}-500 cursor-pointer p-3 flex items-center justify-between hover:bg-slate-50 transition-colors`}>
                              <div className="flex items-center gap-3 overflow-hidden">
                                  <div className={`w-10 h-10 rounded-md shrink-0 flex items-center justify-center bg-${report.color||'blue'}-50 text-${report.color||'blue'}-600`}>
                                      <i className={`fa-solid ${report.icon||'fa-bug'} text-lg`}></i>
                                  </div>
                                  <div className="truncate">
                                      <div className="flex items-center gap-2 mb-0.5">
                                          <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-100 text-slate-500 shrink-0">{report.category}</span>
                                          <h3 className="font-bold text-sm truncate">{report.title}</h3>
                                      </div>
                                      <p className="text-xs text-slate-500 truncate">{report.description}</p>
                                  </div>
                              </div>
                              <i className="fa-solid fa-chevron-right text-slate-300 text-xs ml-2 shrink-0"></i>
                          </div>
                      ))}
                  </div>
                  {filteredReports.length === 0 && (
                      <div className="text-center py-12 text-slate-400">
                          <i className="fa-solid fa-box-open text-3xl mb-2"></i>
                          <p className="text-sm">見つかりませんでした。</p>
                      </div>
                  )}
              </main>

              <button onClick={() => { if(verifyAdminPassword()) { setEditingReport(null); setIsFormOpen(true); } }}
                  className="fixed bottom-8 right-8 w-12 h-12 bg-blue-600 hover:bg-blue-700 text-white rounded-full shadow-lg flex items-center justify-center hover:scale-105 z-10" style={{ border: 'none', cursor: 'pointer' }}>
                  <i className="fa-solid fa-plus text-xl"></i>
              </button>

              {selectedReport && (
                  <div className="fixed inset-0 z-50 flex items-center justify-center p-3" style={{ background: 'rgba(15, 23, 42, 0.6)' }} onClick={() => setSelectedReport(null)}>
                      <div className="bg-white rounded-xl w-full max-w-lg max-h-[90vh] overflow-y-auto shadow-2xl" onClick={e => e.stopPropagation()}>
                          <div className={`h-1.5 w-full bg-${selectedReport.color||'blue'}-500`}></div>
                          <div className="p-5">
                              <div className="flex justify-between items-start mb-4">
                                  <div className="flex items-center gap-3">
                                      <div className={`w-12 h-12 rounded-lg flex items-center justify-center bg-${selectedReport.color||'blue'}-100 text-${selectedReport.color||'blue'}-600`}>
                                          <i className={`fa-solid ${selectedReport.icon||'fa-bug'} text-xl`}></i>
                                      </div>
                                      <div>
                                          <span className="text-[10px] font-bold text-slate-400">{selectedReport.category}</span>
                                          <h2 className="text-lg font-bold">{selectedReport.title}</h2>
                                      </div>
                                  </div>
                                  <button onClick={() => setSelectedReport(null)} className="text-slate-400 hover:text-slate-600" style={{ border: 'none', background: 'none', cursor: 'pointer' }}><i className="fa-solid fa-xmark text-lg"></i></button>
                              </div>

                              <div className="space-y-3">
                                  <div className="bg-slate-50 p-3 rounded-lg border border-slate-100">
                                      <h4 className="text-xs font-bold text-slate-700 mb-1 flex items-center gap-1"><i className="fa-solid fa-circle-info text-blue-500"></i> 現象</h4>
                                      <p className="text-sm text-slate-600">{selectedReport.description}</p>
                                  </div>
                                  <div className="bg-red-50 p-3 rounded-lg border border-red-100">
                                      <h4 className="text-xs font-bold text-red-700 mb-1 flex items-center gap-1"><i className="fa-solid fa-magnifying-glass text-red-500"></i> 原因</h4>
                                      <p className="text-sm text-red-900">{selectedReport.cause}</p>
                                  </div>
                                  <div className="bg-emerald-50 p-3 rounded-lg border border-emerald-100">
                                      <h4 className="text-xs font-bold text-emerald-700 mb-1 flex items-center gap-1"><i className="fa-solid fa-shield-halved text-emerald-500"></i> 対策案</h4>
                                      <p className="text-sm text-emerald-900">{selectedReport.countermeasure}</p>
                                  </div>
                                  <div className="bg-amber-50 p-3 rounded-lg border border-amber-100">
                                      <h4 className="text-xs font-bold text-amber-700 mb-1 flex items-center gap-1"><i className="fa-solid fa-lightbulb text-amber-500"></i> 考察・ポイント</h4>
                                      <p className="text-sm text-amber-900">{selectedReport.consideration}</p>
                                  </div>
                              </div>

                              <div className="mt-5 pt-3 border-t border-slate-100 flex justify-between items-center text-xs text-slate-400">
                                  <div><i className="fa-solid fa-user-pen"></i> {selectedReport.author}</div>
                                  <div className="flex gap-2">
                                      <button onClick={() => { if(verifyAdminPassword()) { setSelectedReport(null); setEditingReport(selectedReport); setIsFormOpen(true); } }} className="px-3 py-1.5 font-bold text-blue-600 bg-blue-50 rounded" style={{ border: 'none', cursor: 'pointer' }}>編集</button>
                                      <button onClick={() => handleDelete(selectedReport.id)} className="px-3 py-1.5 font-bold text-red-600 bg-red-50 rounded" style={{ border: 'none', cursor: 'pointer' }}>削除</button>
                                  </div>
                              </div>
                          </div>
                      </div>
                  </div>
              )}

              {isFormOpen && (
                  <TroubleFormModal 
                      onClose={() => { setIsFormOpen(false); setEditingReport(null); }} 
                      onSave={handleSaveReport} 
                      initialData={editingReport} 
                  />
              )}
          </div>
      );
  };

  const TroubleFormModal = ({ onClose, onSave, initialData }) => {
      const [formData, setFormData] = useState(initialData || {
          title: "", category: "表面異常", description: "", cause: "", countermeasure: "", consideration: "", icon: "fa-bug", color: "slate",
          author: localStorage.getItem('powderCoatingUser') || ""
      });

      const handleChange = (e) => setFormData({ ...formData, [e.target.name]: e.target.value });

      return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-3" style={{ background: 'rgba(15, 23, 42, 0.6)' }} onClick={onClose}>
              <div className="bg-white rounded-xl w-full max-w-2xl max-h-[95vh] overflow-hidden shadow-2xl flex flex-col" onClick={e => e.stopPropagation()}>
                  <div className="p-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                      <h2 className="text-md font-bold flex items-center gap-2">
                          <i className={`fa-solid ${initialData ? 'fa-pen' : 'fa-plus'} text-blue-500`}></i>
                          {initialData ? "レポート編集" : "新規不具合レポート"}
                      </h2>
                      <button onClick={onClose} className="text-slate-400" style={{ border: 'none', background: 'none', cursor: 'pointer' }}><i className="fa-solid fa-xmark text-lg"></i></button>
                  </div>
                  
                  <div className="p-4 overflow-y-auto flex-1 hide-scrollbar space-y-4">
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                          <div>
                              <label className="block text-xs font-bold text-slate-700 mb-1">タイトル</label>
                              <input type="text" name="title" value={formData.title} onChange={handleChange} className="w-full px-3 py-1.5 border rounded text-sm focus:outline-none focus:border-blue-400" required />
                          </div>
                          <div>
                              <label className="block text-xs font-bold text-slate-700 mb-1">カテゴリ</label>
                              <select name="category" value={formData.category} onChange={handleChange} className="w-full px-3 py-1.5 border rounded text-sm focus:outline-none focus:border-blue-400">
                                  {categories.filter(c => c !== "すべて").map(c => <option key={c} value={c}>{c}</option>)}
                              </select>
                          </div>
                      </div>

                      <div className="space-y-3">
                          <div><label className="block text-xs font-bold text-slate-700 mb-1">現象</label><textarea name="description" value={formData.description} onChange={handleChange} rows="2" className="w-full px-3 py-1.5 border rounded text-sm focus:outline-none focus:border-blue-400"></textarea></div>
                          <div><label className="block text-xs font-bold text-red-700 mb-1">原因</label><textarea name="cause" value={formData.cause} onChange={handleChange} rows="2" className="w-full px-3 py-1.5 border bg-red-50 rounded text-sm focus:outline-none focus:border-red-400"></textarea></div>
                          <div><label className="block text-xs font-bold text-emerald-700 mb-1">対策案</label><textarea name="countermeasure" value={formData.countermeasure} onChange={handleChange} rows="2" className="w-full px-3 py-1.5 border bg-emerald-50 rounded text-sm focus:outline-none focus:border-emerald-400"></textarea></div>
                          <div><label className="block text-xs font-bold text-amber-700 mb-1">考察・ポイント</label><textarea name="consideration" value={formData.consideration} onChange={handleChange} rows="2" className="w-full px-3 py-1.5 border bg-amber-50 rounded text-sm focus:outline-none focus:border-amber-400"></textarea></div>
                      </div>

                      <div className="bg-blue-50 p-3 rounded-lg border border-blue-100">
                          <label className="block text-xs font-bold text-blue-800 mb-1"><i className="fa-solid fa-user-pen"></i> レポート者</label>
                          <input type="text" name="author" value={formData.author} onChange={handleChange} placeholder="例: 山田太郎 (次回以降自動入力)" className="w-full px-3 py-1.5 border border-blue-200 rounded text-sm focus:outline-none focus:border-blue-400" required />
                      </div>
                      
                      <div className="grid grid-cols-2 gap-4 pt-2">
                          <div>
                              <label className="block text-xs font-bold text-slate-700 mb-1">アイコン</label>
                              <div className="flex flex-wrap gap-1">
                                  {icons.slice(0, 15).map(icon => (
                                      <button key={icon} type="button" onClick={() => setFormData({...formData, icon})} className={`w-7 h-7 rounded text-xs flex items-center justify-center ${formData.icon === icon ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-500'}`} style={{ border: 'none', cursor: 'pointer' }}><i className={`fa-solid ${icon}`}></i></button>
                                  ))}
                              </div>
                          </div>
                          <div>
                              <label className="block text-xs font-bold text-slate-700 mb-1">カラー</label>
                              <div className="flex flex-wrap gap-1">
                                  {colors.map(c => (
                                      <button key={c} type="button" onClick={() => setFormData({...formData, color: c})} className={`w-5 h-5 rounded-full bg-${c}-500 border-2 ${formData.color === c ? 'border-slate-800' : 'border-transparent'}`} style={{ cursor: 'pointer' }}/>
                                  ))}
                              </div>
                          </div>
                      </div>
                  </div>

                  <div className="p-4 border-t border-slate-100 bg-slate-50 flex justify-end gap-2">
                      <button onClick={onClose} className="px-4 py-2 rounded text-sm font-bold text-slate-600 bg-white border border-slate-200" style={{ cursor: 'pointer' }}>キャンセル</button>
                      <button onClick={() => onSave(formData)} disabled={!formData.title || !formData.author} className="px-4 py-2 rounded text-sm font-bold text-white bg-blue-600 disabled:opacity-50" style={{ border: 'none', cursor: 'pointer' }}>保存</button>
                  </div>
              </div>
          </div>
      );
  };

  const root = ReactDOM.createRoot(document.getElementById('trouble-db-root'));
  root.render(<TroubleDbApp />);
</script>
</body>
</html>
